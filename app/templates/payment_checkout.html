<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Fresh Shop – Payment</title>
  <script type="text/javascript" src="https://jstest.authorize.net/v1/Accept.js" charset="utf-8"></script>
  <style>
      body{font-family: Arial, Helvetica, sans-serif;margin:0;padding:0;background:#fafafa;color:#333}
      .container{max-width:480px;margin:0 auto;padding:24px}
      h2{text-align:center;margin-bottom:16px}
      .field{margin-bottom:12px;display:flex;flex-direction:column}
      .field label{font-size:14px;margin-bottom:4px}
      .field input{padding:10px;font-size:16px;border:1px solid #ccc;border-radius:4px}
      button{width:100%;padding:14px;margin-top:12px;background:#28a745;border:none;color:#fff;font-size:16px;border-radius:4px;cursor:pointer}
      button:disabled{opacity:.6;cursor:not-allowed}
      #status{margin-top:16px;text-align:center}
  </style>
</head>
<body>
  <div class="container">
      <h2>Complete Payment</h2>
      <!-- <p style="text-align:center">Amount: <strong>${{ amount }}</strong></p> -->
      <form id="paymentForm" onsubmit="event.preventDefault();sendPayment();">
          <div class="field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" required>
          </div>
          <div class="field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" required>
          </div>

          <!-- Prefilled delivery info -->
          <div class="field">
              <label>Delivery Type</label>
              <input type="text" id="deliveryTypeDisplay" readonly>
          </div>

          <div class="field">
              <label for="country">Country / Region</label>
              <input type="text" id="country" value="United States" required readonly>
          </div>
          <div class="field">
              <label for="shipping_address">Street Address</label>
              <input type="text" id="shipping_address" required>
          </div>
          <div class="field">
              <label for="shipping_city">Town / City</label>
              <input type="text" id="shipping_city" required>
          </div>
          <div class="field">
              <label for="shipping_state">State / County</label>
              <input type="text" id="shipping_state" required>
          </div>
          <div class="field">
              <label for="whatsapp_number">WhatsApp Number</label>
              <input type="text" id="whatsapp_number">
          </div>
          <div class="field">
              <label for="email_address">Email Address</label>
              <input type="email" id="email_address">
          </div>
          <div class="field">
              <label for="order_notes">Order Notes</label>
              <textarea id="order_notes" rows="2"></textarea>
          </div>

          <div id="pickupFields" style="display:none">
              <div class="field">
                  <label>Airport</label>
                  <input type="text" id="airportDisplay" readonly>
              </div>
          </div>

          <div id="doorstepFields" style="display:none">
              <div class="field">
                  <label>Address</label>
                  <input type="text" id="addressDisplay" readonly>
              </div>
              <div class="field">
                  <label>State</label>
                  <input type="text" id="stateDisplay" readonly>
              </div>
              <div class="field">
                  <label>Zip</label>
                  <input type="text" id="zipDisplay" readonly>
              </div>
          </div>

          <div class="field">
              <label for="phone">Phone</label>
              <input type="text" id="phone" required>
          </div>
          <div class="field">
              <label for="cardNumber">Card Number</label>
              <input type="text" id="cardNumber" autocomplete="cc-number" required>
          </div>
          <div class="field">
              <label for="expMonth">Expiry Month (MM)</label>
              <input type="text" id="expMonth" maxlength="2" required>
          </div>
          <div class="field">
              <label for="expYear">Expiry Year (YYYY)</label>
              <input type="text" id="expYear" maxlength="4" required>
          </div>
          <div class="field">
              <label for="cardCode">CVC</label>
              <input type="text" id="cardCode" maxlength="4" required>
          </div>
          <button id="payButton" type="submit">Pay</button>
      </form> 
      <div id="status"></div>
  </div>

<script>
  const CLIENT_KEY = "7z7qqNqC857FB2x24keSAA4dbA2yUPh9x2UHtdkt4kR54AG5HVPUKYa3r9RTRdjL";
  const API_LOGIN_ID = "4td4BU4F";
  // Amount injected by backend as string to avoid lint errors, then parsed
  const urlParams = new URLSearchParams(window.location.search);
  const AMOUNT = parseFloat(urlParams.get('amount')) || 0;
  const AUTH_TOKEN = urlParams.get("auth_token");
  // Optional encoded JSON context passed from the mobile/web app
  const RAW_CONTEXT = urlParams.get("context");
  let CONTEXT = {};
  try {
      if (RAW_CONTEXT) {
          CONTEXT = JSON.parse(decodeURIComponent(RAW_CONTEXT));
      }
  } catch (err) {
      console.warn("Unable to parse context param", err);
  }
  const ITEMS = CONTEXT.items || [];
  const DELIVERY_TYPE = CONTEXT.delivery_type || "pickup";  // default

  // Prefill form fields once DOM is ready
  window.addEventListener('DOMContentLoaded', () => {
      // Prefill new fields from CONTEXT
      if (CONTEXT.country) document.getElementById('country').value = CONTEXT.country;
      if (CONTEXT.shipping_address) document.getElementById('shipping_address').value = CONTEXT.shipping_address;
      if (CONTEXT.shipping_city) document.getElementById('shipping_city').value = CONTEXT.shipping_city;
      if (CONTEXT.shipping_state) document.getElementById('shipping_state').value = CONTEXT.shipping_state;
      if (CONTEXT.whatsapp_number) document.getElementById('whatsapp_number').value = CONTEXT.whatsapp_number;
      if (CONTEXT.email_address) document.getElementById('email_address').value = CONTEXT.email_address;
      if (CONTEXT.order_notes) document.getElementById('order_notes').value = CONTEXT.order_notes;

      const dtDisplay = document.getElementById('deliveryTypeDisplay');
      if (dtDisplay) dtDisplay.value = DELIVERY_TYPE;

      if (DELIVERY_TYPE === 'pickup') {
          document.getElementById('pickupFields').style.display = 'block';
          document.getElementById('doorstepFields').style.display = 'none';
          document.getElementById('airportDisplay').value = `${CONTEXT.airport_name || ''} (${CONTEXT.airport_code || ''})`;
      } else {
          document.getElementById('pickupFields').style.display = 'none';
          document.getElementById('doorstepFields').style.display = 'block';
          document.getElementById('addressDisplay').value = CONTEXT.shipping_address || '';
          document.getElementById('stateDisplay').value = CONTEXT.shipping_state || '';
          document.getElementById('zipDisplay').value = CONTEXT.shipping_zip || '';
      }

      if (CONTEXT.phone) {
          const phoneInput = document.getElementById('phone');
          if (phoneInput) phoneInput.value = CONTEXT.phone;
      }
  });
  
  const PAYMENT_ENDPOINT = "https://api.farmfreshshop.com/api/v1/orders/"
  console.log("Parsed amount:", AMOUNT, "User ID:", AUTH_TOKEN);

//   "/api/v1/payments/process-token";

  const payBtn = document.getElementById('payButton');
  const statusDiv = document.getElementById('status');

  function setStatus(msg, success=false){
      statusDiv.innerText = msg;
      statusDiv.style.color = success ? 'green' : 'red';
  }

  function toggleLoading(isLoading){
      payBtn.disabled = isLoading;
      payBtn.innerText = isLoading ? 'Processing…' : `Pay $${AMOUNT}`;
  }

  function sendPayment(){
      toggleLoading(true);

      const secureData = {
          authData: {
              clientKey: CLIENT_KEY,
              apiLoginID: API_LOGIN_ID
          },
          cardData: {
              cardNumber: document.getElementById('cardNumber').value.replace(/\s+/g, ''),
              month: document.getElementById('expMonth').value,
              year: document.getElementById('expYear').value,
              cardCode: document.getElementById('cardCode').value,
          }
      };

      Accept.dispatchData(secureData, responseHandler);
  }

  async function responseHandler(response){
      if(response.messages.resultCode === 'Error'){
          const msg = response.messages.message[0].text;
          setStatus(`Tokenization Error: ${msg}`);
          toggleLoading(false);
          return;
      }

      const tokenData = response.opaqueData;
      console.log(tokenData);
      try{
          const res = await fetch(PAYMENT_ENDPOINT, {
              method: 'POST',
              headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${AUTH_TOKEN}`},

              body: JSON.stringify({
                  amount: AMOUNT,
                  data_descriptor: tokenData.dataDescriptor,
                  data_value: tokenData.dataValue,
                  first_name: document.getElementById('firstName').value,
                  last_name: document.getElementById('lastName').value,
                  items: ITEMS,
                  delivery_type: DELIVERY_TYPE,
                  shipping_zip: document.getElementById('zipDisplay') ? document.getElementById('zipDisplay').value : CONTEXT.shipping_zip,
                  shipping_address: document.getElementById('shipping_address') ? document.getElementById('shipping_address').value : CONTEXT.shipping_address,
                  shipping_city: document.getElementById('shipping_city') ? document.getElementById('shipping_city').value : CONTEXT.shipping_city,
                  shipping_state: document.getElementById('shipping_state') ? document.getElementById('shipping_state').value : CONTEXT.shipping_state,
                  country: document.getElementById('country') ? document.getElementById('country').value : CONTEXT.country,
                  whatsapp_number: document.getElementById('whatsapp_number') ? document.getElementById('whatsapp_number').value : CONTEXT.whatsapp_number,
                  email_address: document.getElementById('email_address') ? document.getElementById('email_address').value : CONTEXT.email_address,
                  order_notes: document.getElementById('order_notes') ? document.getElementById('order_notes').value : CONTEXT.order_notes,
                  phone: document.getElementById('phone') ? document.getElementById('phone').value : CONTEXT.phone,
                  airport_code: CONTEXT.airport_code,
                  airport_name: CONTEXT.airport_name,
              })
          });
          const data = await res.json();
          console.log(data);
          if(res.ok && data.success){
              setStatus('Payment Successful!', true);
              // Notify mobile app via custom scheme
              window.location.href = `farmfresh://payment/success?txId=${data.transaction_id}`;
          }else{
              const failMsg = data.message || 'Payment failed';
              setStatus(failMsg);
              console.error("Payment Failed:", failMsg);
              window.location.href = `farmfresh://payment/fail?msg=${encodeURIComponent(failMsg)}`;
          }
      }catch(err){
          setStatus('Network error processing payment');
      }finally{
          toggleLoading(false);
      }
  }
</script>
</body>
</html>
