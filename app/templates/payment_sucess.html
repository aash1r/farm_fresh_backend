<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payment Success</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 380px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #90c695 0%, #7fb069 100%);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: bounceIn 1s ease-out 0.3s both;
        }

        .success-icon::before {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            background: rgba(144, 198, 149, 0.2);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .checkmark {
            color: white;
            font-size: 3rem;
            font-weight: bold;
            z-index: 1;
        }

        .mango-emoji {
            position: absolute;
            top: -10px;
            right: -5px;
            font-size: 2rem;
            z-index: 2;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 1.8rem;
            color: #2d3436;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1rem;
            color: #636e72;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .order-details {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            margin: 25px 0;
            border-left: 4px solid #90c695;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .order-row:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px solid #e9ecef;
            font-weight: 600;
        }

        .order-label {
            color: #636e72;
            font-size: 0.9rem;
        }

        .order-value {
            color: #2d3436;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #90c695 0%, #7fb069 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(144, 198, 149, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #636e72;
            border: 2px solid #e9ecef;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
            border-color: #90c695;
        }

        .delivery-info {
            background: linear-gradient(135deg, rgba(144, 198, 149, 0.1) 0%, rgba(127, 176, 105, 0.05) 100%);
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .truck-icon {
            font-size: 1.5rem;
        }

        .delivery-text {
            flex: 1;
            text-align: left;
        }

        .delivery-title {
            font-weight: 600;
            color: #2d3436;
            font-size: 0.9rem;
        }

        .delivery-subtitle {
            color: #636e72;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px;
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .success-icon {
                width: 100px;
                height: 100px;
            }
            
            .checkmark {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <div class="checkmark">✓</div>
            <div class="mango-emoji">🥭</div>
        </div>
        
        <h1>Payment Successful!</h1>
        <p class="subtitle">Your fresh mango order has been confirmed and will be prepared shortly.</p>
        
        <div class="delivery-info">
            <div class="truck-icon">🚚</div>
            <div class="delivery-text">
                <div class="delivery-title">Ready for pickup</div>
            </div>
        </div>
    </div>

    <script>
        function returnToApp() {
            // Close the web view or redirect back to app
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ action: 'close' }));
            } else {
                window.close();
            }
        }

        // Simulate confetti or celebration effect
        setTimeout(() => {
            console.log('🎉 Payment completed successfully!');
        }, 1000);
    </script>
</body>
</html>
